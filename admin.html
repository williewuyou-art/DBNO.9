<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大本9號｜報告管理後台</title><style>
:root{--navy:#102a43;--blue:#1769aa;--bg:#f2f5f8;--line:#d8e1ea;--text:#172b3a;--muted:#627487;--green:#18794e;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--text)}header{background:linear-gradient(120deg,#102a43,#1769aa);color:white;padding:26px 18px}header .wrap,main{max-width:1050px;margin:auto}header h1{margin:0 0 7px;font-size:clamp(24px,4vw,34px)}header p{margin:0;opacity:.86}main{padding:22px 14px 55px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;margin-bottom:17px;box-shadow:0 5px 20px #102a4308}.card h2{font-size:19px;margin:0 0 8px}.muted{color:var(--muted);font-size:13px;line-height:1.65}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-top:13px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,textarea,select{width:100%;border:1px solid #bccbd8;border-radius:8px;padding:11px;font:inherit;background:white;color:var(--text)}button{border:0;border-radius:8px;background:var(--blue);color:white;font-weight:700;font-size:13px;padding:10px 13px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e8eef4;color:var(--navy)}.danger{background:#b42318}.green{background:#18794e}.drop{margin-top:13px;border:2px dashed #91a9bf;border-radius:13px;padding:28px 16px;text-align:center;background:#f8fbfe;cursor:pointer}.drop.over{border-color:var(--blue);background:#eaf4ff}.drop strong{display:block;margin-bottom:6px}.drop input{display:none}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:15px}.status{margin-top:12px;padding:11px;border-radius:8px;display:none;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.status.ok{display:block;background:#e9f7ef;color:var(--green)}.status.err{display:block;background:#fff0ef;color:var(--red)}.status.info{display:block;background:#edf5ff;color:#174a7c}.hidden{display:none!important}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}th{background:#f7fafc;color:#526779}.badge{display:inline-block;padding:4px 7px;border-radius:99px;font-size:11px;background:#e9f7ef;color:#17613e}.badge.off{background:#fff0df;color:#92520b}.rowactions{display:flex;gap:6px;flex-wrap:wrap}.rowactions button{padding:7px 9px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:15px}}
</style></head><body><header><div class="wrap"><h1>大本9號｜報告管理後台</h1><p>拖曳上傳、一鍵上架、下架、編輯及永久刪除。</p></div></header><main>
<section class="card" id="loginCard"><h2>管理員登入</h2><p class="muted">請輸入 Cloudflare Worker 中設定的 ADMIN_PASSWORD。所有管理操作均由後端驗證。</p><div class="field"><label for="password">管理密碼</label><input id="password" type="password" autocomplete="current-password" placeholder="輸入管理密碼"></div><div class="actions"><button id="loginBtn">登入並載入報告</button><a href="reports.html">前往前端報告中心</a></div><div id="loginStatus" class="status"></div></section>
<section class="card hidden" id="uploadCard"><h2>拖曳上傳新報告</h2><p class="muted">支援 PDF、Word、Excel、ZIP 及常見圖片，單檔上限 20 MB。上傳後會自動加入前端清單。</p><form id="uploadForm"><div class="drop" id="drop"><strong>將檔案拖曳到此處</strong><span class="muted">或點擊選擇檔案</span><input id="file" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.zip,.png,.jpg,.jpeg,.webp"></div><p id="fileInfo" class="muted">尚未選擇檔案</p><div class="grid"><div class="field"><label for="name">報告名稱 *</label><input id="name" maxlength="120" required placeholder="例如：大本9號雙主機自檢報告"></div><div class="field"><label for="date">報告日期</label><input id="date" type="date"></div><div class="field"><label for="category">報告分類</label><select id="category"><option>主機檢修</option><option>完工報告</option><option>保養紀錄</option><option>配電與電氣</option><option>管路與閥件</option><option>其他</option></select></div><div class="field"><label for="description">報告說明</label><input id="description" maxlength="240" placeholder="簡述報告內容"></div></div><div class="actions"><button id="uploadBtn" type="submit">上傳並立即上架</button><button class="secondary" id="resetBtn" type="button">清除</button><button class="secondary" id="refreshBtn" type="button">重新整理清單</button></div><div id="uploadStatus" class="status"></div></form></section>
<section class="card hidden" id="listCard"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2>報告管理清單</h2><span id="count" class="muted"></span></div><p class="muted">下架只會從前端清單隱藏，檔案仍保留；刪除會永久刪除 GitHub 上的檔案及清單紀錄。</p><div class="tablewrap"><table><thead><tr><th>報告名稱</th><th>分類／日期</th><th>狀態</th><th>操作</th></tr></thead><tbody id="rows"><tr><td colspan="4">尚未載入</td></tr></tbody></table></div><div id="listStatus" class="status"></div></section><div class="footer">大本9號報告管理系統｜請勿將管理密碼提供給他人。</div></main>
<script>
const WORKER_URL='https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev';const $=id=>document.getElementById(id);let password='',selectedFile=null,items=[];
function showStatus(id,msg,type='info'){const el=$(id);el.textContent=msg;el.className='status '+type}
async function api(path,body){if(WORKER_URL.includes('YOUR-WORKER'))throw new Error('尚未設定 Worker 網址，請先部署 backend/worker.js 並修改 WORKER_URL。');const r=await fetch(WORKER_URL+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,password})});const d=await r.json();if(!r.ok)throw new Error(d.error||'請求失敗');return d}
$('loginBtn').onclick=async()=>{password=$('password').value;if(!password){showStatus('loginStatus','請輸入管理密碼。','err');return}try{await api('/manage',{action:'list'});$('loginCard').classList.add('hidden');$('uploadCard').classList.remove('hidden');$('listCard').classList.remove('hidden');$('date').value=new Date().toISOString().slice(0,10);await refreshList()}catch(e){showStatus('loginStatus',e.message,'err')}};$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
function chooseFile(f){if(!f)return;selectedFile=f;$('fileInfo').textContent=`已選擇：${f.name}（${(f.size/1048576).toFixed(2)} MB）`;if(!$('name').value)$('name').value=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ')}$('drop').onclick=()=>$('file').click();$('file').onchange=e=>chooseFile(e.target.files[0]);['dragenter','dragover'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.add('over')}));['dragleave','drop'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.remove('over')}));$('drop').addEventListener('drop',e=>chooseFile(e.dataTransfer.files[0]));
$('uploadForm').onsubmit=async e=>{e.preventDefault();if(!selectedFile){showStatus('uploadStatus','請先選擇或拖曳檔案。','err');return}if(selectedFile.size>20*1048576){showStatus('uploadStatus','檔案超過 20 MB。','err');return}const btn=$('uploadBtn');btn.disabled=true;showStatus('uploadStatus','正在上傳並更新前端清單…');try{const fd=new FormData();fd.append('password',password);fd.append('file',selectedFile);fd.append('name',$('name').value.trim());fd.append('date',$('date').value);fd.append('category',$('category').value);fd.append('description',$('description').value.trim());const r=await fetch(WORKER_URL+'/upload',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||'上傳失敗');showStatus('uploadStatus','上架成功！檔案路徑：'+d.path,'ok');$('uploadForm').reset();selectedFile=null;$('fileInfo').textContent='尚未選擇檔案';$('date').value=new Date().toISOString().slice(0,10);await refreshList()}catch(err){showStatus('uploadStatus',err.message,'err')}finally{btn.disabled=false}};
async function refreshList(){try{const d=await api('/manage',{action:'list'});items=d.files||[];renderList();showStatus('listStatus','清單已更新。','ok')}catch(e){showStatus('listStatus',e.message,'err')}}
function renderList(){const root=$('rows');root.innerHTML='';$('count').textContent=`共 ${items.length} 份報告`;if(!items.length){root.innerHTML='<tr><td colspan="4">目前沒有報告。</td></tr>';return}items.forEach(item=>{const tr=document.createElement('tr');const td1=document.createElement('td');td1.textContent=item.name||'未命名報告';const td2=document.createElement('td');td2.textContent=[item.category,item.date].filter(Boolean).join('／')||item.description||'—';const td3=document.createElement('td');const badge=document.createElement('span');badge.className='badge'+(item.published===false?' off':'');badge.textContent=item.published===false?'已下架':'已上架';td3.append(badge);const td4=document.createElement('td');td4.className='rowactions';const toggle=document.createElement('button');toggle.className=item.published===false?'green':'secondary';toggle.textContent=item.published===false?'重新上架':'下架';toggle.onclick=()=>manageItem(item,item.published===false?'publish':'unpublish');const edit=document.createElement('button');edit.className='secondary';edit.textContent='編輯';edit.onclick=()=>editItem(item);const del=document.createElement('button');del.className='danger';del.textContent='刪除';del.onclick=()=>deleteItem(item);td4.append(toggle,edit,del);tr.append(td1,td2,td3,td4);root.append(tr)})}
async function manageItem(item,action){const label=action==='unpublish'?'下架':'重新上架';if(!confirm(`確定要${label}「${item.name}」嗎？`))return;try{await api('/manage',{action,id:item.id||item.file});await refreshList()}catch(e){showStatus('listStatus',e.message,'err')}}
async function editItem(item){const name=prompt('報告名稱',item.name||'');if(name===null)return;if(!name.trim()){alert('報告名稱不可空白');return}const category=prompt('報告分類',item.category||'其他');if(category===null)return;const date=prompt('報告日期（YYYY-MM-DD，可留空）',item.date||'');if(date===null)return;const description=prompt('報告說明',item.description||'');if(description===null)return;try{await api('/manage',{action:'update',id:item.id||item.file,name:name.trim(),category:category.trim(),date:date.trim(),description:description.trim()});await refreshList()}catch(e){showStatus('listStatus',e.message,'err')}}
async function deleteItem(item){if(!confirm(`確定永久刪除「${item.name}」？\n此操作會刪除 GitHub 上的檔案，無法從本後台復原。`))return;if(!confirm('再次確認：確定永久刪除？'))return;try{await api('/manage',{action:'delete',id:item.id||item.file});await refreshList();showStatus('listStatus','已永久刪除報告。','ok')}catch(e){showStatus('listStatus',e.message,'err')}}
$('refreshBtn').onclick=refreshList;$('resetBtn').onclick=()=>{ $('uploadForm').reset();selectedFile=null;$('fileInfo').textContent='尚未選擇檔案';$('date').value=new Date().toISOString().slice(0,10);$('uploadStatus').className='status'};
</script></body></html>
