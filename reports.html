<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大本9號｜報告下載中心</title><style>:root{--navy:#102a40;--blue:#176b87;--bg:#f2f6f8;--ink:#203542;--muted:#637b88;--line:#d5e1e7}*{box-sizing:border-box}body{margin:0;padding:clamp(14px,3vw,30px);background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}header{background:linear-gradient(120deg,#102a40,#176b87);color:#fff;padding:23px;border-radius:14px;margin-bottom:16px}header h1{font-size:clamp(22px,3vw,30px);margin:0 0 7px}header p{margin:0;color:#d9eaf0;line-height:1.7;font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px}h2{font-size:17px;color:var(--navy);margin:0 0 12px}.empty{border:1px dashed #b9cbd4;background:#f9fbfc;border-radius:10px;padding:22px;text-align:center;color:var(--muted);line-height:1.8}.filelist{display:grid;gap:10px}.file{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:13px}.file strong{display:block}.file small{display:block;color:var(--muted);margin-top:4px;line-height:1.5}.download{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;padding:10px 13px;border-radius:8px;font-size:13px;font-weight:700;white-space:nowrap}.muted{font-size:12px;color:var(--muted);line-height:1.7}@media(max-width:550px){.file{align-items:flex-start;flex-direction:column}}</style></head><body><header><h1>報告下載中心</h1><p>大本9號｜工程完工報告、自檢報告、施工紀錄及相關附件。</p></header><section class="card"><h2>可下載文件</h2><div id="files" class="filelist"><div class="empty">正在載入報告清單…</div></div><p class="muted">報告清單會自動更新；若剛上架或下架，GitHub Pages 可能需要數分鐘完成部署。</p></section><script>
async function loadFiles(){const root=document.getElementById('files');let list=[];try{const r=await fetch('reports.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('清單讀取失敗');const d=await r.json();list=(d.files||[]).filter(x=>x.published!==false)}catch(e){root.innerHTML='<div class="empty">目前無法載入報告清單，請稍後重新整理。</div>';return}root.innerHTML='';if(!list.length){root.innerHTML='<div class="empty">目前尚未上架報告。</div>';return}list.forEach(item=>{const row=document.createElement('div');row.className='file';const info=document.createElement('div');const name=document.createElement('strong');name.textContent=item.name||'未命名文件';const desc=document.createElement('small');desc.textContent=[item.category,item.date,item.description].filter(Boolean).join('｜');info.append(name,desc);const a=document.createElement('a');a.className='download';a.href=item.file;a.download='';a.textContent='下載文件';row.append(info,a);root.append(row)})}loadFiles();
</script></body></html>
